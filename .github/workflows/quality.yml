name: quality

permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened]

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
        with:
          max-failures: 4
          close-pr: false
          lock-pr: false
